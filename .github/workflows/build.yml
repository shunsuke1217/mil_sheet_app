name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt pyinstaller
      - run: pytest -q
      - run: pyinstaller --noconfirm --windowed ${{ runner.os == 'Windows' && '--onefile' || '' }} --name ミルシート読み取り main.py
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/ミルシート読み取り.app" "dist/ミルシート読み取り-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ミルシート読み取り-${{ matrix.os }}
          path: ${{ runner.os == 'Windows' && 'dist/ミルシート読み取り.exe' || 'dist/ミルシート読み取り-mac.zip' }}
